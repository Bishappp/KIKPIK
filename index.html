function calcRows() {
  const vw = window.innerWidth || 390, vh = window.innerHeight || 780;
  let asp = vh / vw;
  if (asp < 1.45) asp = 1.6;           // компьютер / планшет — аккуратная «вертикальная» рамка
  return clamp(Math.floor((W * asp - TOP) / T), 14, 27);
}
function applyRows(r) { ROWS = r; H = TOP + ROWS * T; resize(); }
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const pad = vw > 640 ? 24 : 0;
  const s = Math.min((vw - pad) / W, (vh - pad) / H);
  const dpr = window.devicePixelRatio || 1;
  K = Math.max(1, Math.ceil(s * dpr));
  cv.width = W * K; cv.height = H * K;
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  ctx.imageSmoothingEnabled = false;
}

function hsl(h, s, l) {
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  const hx = x => Math.round(clamp(x, 0, 1) * 255).toString(16).padStart(2, '0');
  return '#' + hx(f(0)) + hx(f(8)) + hx(f(4));
}
let THEME = null;
function makeTheme(lv) {
  const h0 = (lv * 97 + 330) % 360, step = [28, 40, 55, -30][lv % 4];
  const layers = [];
  for (let i = 0; i < 4; i++) {
    const h = h0 + i * step, L = 85 - i * 4, S = 72 + (lv % 3) * 6;
    layers.push({ b: hsl(h, S, L), d: hsl(h, S - 5, L - 10), e: hsl(h, S - 10, L - 19) });
  }
  return {
    layers,
    sky: hsl(h0 + 180, 90, 95), sky2: hsl(h0 + 180, 80, 90),
    tun: hsl(h0 + 250, 38, 22), tun2: hsl(h0 + 250, 42, 13),
    flower: [hsl(h0 + 120, 85, 72), hsl(h0 + 200, 85, 75)]
  };
}

function mk(rows) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) { const ch = row[i]; if (ch !== '.' && PAL[ch]) { x.fillStyle = PAL[ch]; x.fillRect(i, j, 1, 1); } } });
  return c;
}
function flip(src) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0); return c;
}
function tint(src, col, a) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0);
  x.globalCompositeOperation = 'source-atop'; x.globalAlpha = a; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
  return c;
}

let AC = null, NB = null, muted = false;
function unlock() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function noiseBuf() {
  if (!NB) {
    NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return NB;
}
function env(g, t, v, d, a = .005) {
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a);
  g.gain.exponentialRampToValueAtTime(.0001, t + d);
}
function tone(f1, f2, d, type = 'square', v = .06, delay = 0, vib = 0) {
  if (muted || !AC) return;
  try {
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + d);
    if (vib) { const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = 18; lg.gain.value = vib; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + d + .05); }
    env(g, t, v, d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .05);
  } catch (e) {}
}
function noise(d, f1, f2, v, type = 'bandpass', q = 1, delay = 0) {
  if (muted || !AC) return;
  try {
    const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t + d);
    env(g, t, v, d); s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start(t, Math.random() * .5); s.stop(t + d + .05);
  } catch (e) {}
}
function meow(p = 1, delay = 0, v = .07) {
  if (muted || !AC) return;
  try {
    const t = AC.currentTime + delay, o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(520 * p, t);
    o.frequency.linearRampToValueAtTime(820 * p, t + .14);
    o.frequency.linearRampToValueAtTime(600 * p, t + .32);
    o.frequency.linearRampToValueAtTime(430 * p, t + .45);
    f.type = 'lowpass'; f.Q.value = 6;
    f.frequency.setValueAtTime(700, t); f.frequency.linearRampToValueAtTime(2600, t + .14); f.frequency.linearRampToValueAtTime(900, t + .45);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .05);
    g.gain.setValueAtTime(v, t + .3); g.gain.exponentialRampToValueAtTime(.0001, t + .5);
    o.connect(f); f.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .55);
  } catch (e) {}
}

      const fx = x0 + f.dir * i, s = 3 + Math.min(4, i / 6) + (Math.floor(gt * 20 + i) % 2);
      if (!pass) { ctx.fillStyle = PAL.k; ctx.fillRect(Math.round(fx - s / 2 - 1), Math.round(y - s / 2 - 1), Math.round(s + 2), Math.round(s + 2)); }
      else {
        ctx.fillStyle = (Math.floor(i / 4 + gt * 12) % 2) ? PAL.y : PAL.p;
        ctx.fillRect(Math.round(fx - s / 2), Math.round(y - s / 2), Math.round(s), Math.round(s));
        ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(fx), Math.round(y), 1, 1);
      }
    }
  }
}
function drawPlayer() {
  const P = player; if (!P) return;
  const sx = P.x, sy = TOP + P.y - 2;
  const hs = S.hero[0], R = P.face > 0;
  if (state === 'dying') {
    const t = P.deadT;
    if (t < .5) spr((Math.floor(t * 20) % 2) ? (R ? hs.wr : hs.wl) : (R ? hs.r : hs.l), sx + (Math.floor(t * 30) % 2 ? 1 : -1), sy);
    else if (t < 1.4) {
      const k = 1 - (t - .5) / .9;
      ctx.save(); ctx.translate(Math.round(sx), Math.round(sy)); ctx.rotate((t - .5) * 10);
      spr(R ? hs.r : hs.l, 0, 0, k, k); ctx.restore();
    }
    return;
  }
  shadow(sx, sy + 3, 12);
  if (state === 'clear') { spr(S.hero[Math.floor(gt * 6) % 2][R ? 'r' : 'l'], sx, sy - Math.abs(Math.sin(gt * 8)) * 6); return; }
  const fr = P.moving ? Math.floor(P.anim * 8) % 2 : 0;
  const bob = P.moving ? (fr ? -1 : 0) : 0;
  const jx = P.pump && P.pump.tick > .22 ? -P.pump.d[0] : 0;
  spr(S.hero[fr][R ? 'r' : 'l'], sx + jx, sy + bob);
  if (P.pump) {
    const p = P.pump, e = p.e, d = p.d;
    const ax = P.x + d[0] * 9, ay = TOP + P.y + d[1] * 9 + (d[0] ? 3 : 0);
    const ex = e.x - d[0] * (6 + e.infl), ey = TOP + e.y - d[1] * (6 + e.infl) + (d[0] ? 1 : 0);
    const bx = ax + (ex - ax) * p.ext, by = ay + (ey - ay) * p.ext;
    const x0 = Math.round(Math.min(ax, bx)), y0 = Math.round(Math.min(ay, by));
    const w = Math.round(Math.abs(bx - ax)), h = Math.round(Math.abs(by - ay));
    ctx.fillStyle = PAL.k;
    if (d[0]) ctx.fillRect(x0, y0 - 1, w + 1, 3); else ctx.fillRect(x0 - 1, y0, 3, h + 1);
    ctx.fillStyle = PAL.y;
    if (d[0]) ctx.fillRect(x0, y0, w + 1, 1); else ctx.fillRect(x0, y0, 1, h + 1);
    ctx.fillStyle = PAL.k; ctx.fillRect(Math.round(bx) - 2, Math.round(by) - 2, 5, 5);
    ctx.fillStyle = PAL.p; ctx.fillRect(Math.round(bx) - 1, Math.round(by) - 1, 3, 3);
  }
}
function drawParts() {
  for (const p of parts) { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size); }
  for (const p of pops) {
    if (p.t > .8 && Math.floor(p.t * 16) % 2) continue;
    const w = p.s.length * 8;
    txt(p.s, clamp(p.x, w / 2 + 2, W - w / 2 - 2), Math.round(p.y), p.col, 8, 'center');
  }
}
function drawSoundIcon(mx, my) {
  ctx.fillStyle = PAL.l;
  ctx.fillRect(mx, my + 4, 3, 5); ctx.fillRect(mx + 3, my + 2, 2, 9); ctx.fillRect(mx + 5, my, 2, 13);
  if (muted) { ctx.fillStyle = PAL.r; for (let i = 0; i < 6; i++) { ctx.fillRect(mx + 9 + i, my + 3 + i, 2, 1); ctx.fillRect(mx + 14 - i, my + 3 + i, 2, 1); } }
  else { ctx.fillRect(mx + 9, my + 4, 1, 5); ctx.fillRect(mx + 12, my + 2, 1, 9); }
}
function drawHUD() {
  ctx.fillStyle = '#2a1838'; ctx.fillRect(0, 0, W, TOP);
  ctx.fillStyle = PAL.k; ctx.fillRect(0, TOP - 1, W, 1);
  txt(String(score).padStart(7, '0'), 4, 3, PAL.y);
  txt(level + '-' + sub, 106, 3, PAL.v, 8, 'center');
  const px = W - 40;
  ctx.fillStyle = PAL.l; ctx.fillRect(px, 3, 3, 11); ctx.fillRect(px + 6, 3, 3, 11);
  drawSoundIcon(W - 20, 2);
  for (let i = 0; i < 5; i++) ctx.drawImage(i < lives ? S.heart : S.heartE, 4 + i * 9, 16);
  const bx = 52, bw = W - bx - 4, by = 17;
  ctx.fillStyle = PAL.k; ctx.fillRect(bx - 1, by - 1, bw + 2, 6);
  ctx.fillStyle = PAL.n; ctx.fillRect(bx, by, bw, 4);
  const fw = Math.round(bw * meter / 100);
  if (fw > 0) {
    ctx.fillStyle = PAL.P; ctx.fillRect(bx, by, fw, 4);
    ctx.fillStyle = PAL.p; ctx.fillRect(bx, by, fw, 2);
    ctx.fillStyle = '#ffc6de'; ctx.fillRect(bx, by, fw, 1);
  }
  for (let i = 1; i < 4; i++) { ctx.fillStyle = 'rgba(29,16,41,.6)'; ctx.fillRect(bx + Math.round(bw * i / 4), by, 1, 4); }
}
function panel(y, h, x = 10, w = W - 20) {
  ctx.fillStyle = PAL.k; ctx.fillRect(x, y - 2, w, h + 4); ctx.fillRect(x - 2, y, w + 4, h);
  ctx.fillStyle = PAL.p; ctx.fillRect(x + 1, y, w - 2, h); ctx.fillRect(x, y + 1, w, h - 2);
  ctx.fillStyle = '#2a1838'; ctx.fillRect(x + 3, y + 2, w - 6, h - 4); ctx.fillRect(x + 2, y + 3, w - 4, h - 6);
}
function button(label, x, y, w, h, col, tcol = PAL.k) {
  ctx.fillStyle = PAL.k; ctx.fillRect(x + 1, y - 1, w - 2, h + 3); ctx.fillRect(x - 1, y + 1, w + 2, h - 1);
  ctx.fillStyle = col; ctx.fillRect(x + 1, y, w - 2, h); ctx.fillRect(x, y + 1, w, h - 2);
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x + 2, y + 1, w - 4, 2);
  ctx.font = '8px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = tcol; ctx.fillText(label, x + w / 2, y + Math.round((h - 8) / 2) + 1);
  return [x, y, w, h];
}
function stageDots(cx, y) {
  for (let i = 1; i <= SUBS; i++) {
    const x = cx - (SUBS * 12) / 2 + (i - 1) * 12 + 2;
    ctx.fillStyle = PAL.k; ctx.fillRect(x - 1, y - 1, 10, 10);
    ctx.fillStyle = i < sub ? PAL.g : i === sub ? (Math.floor(gt * 4) % 2 ? PAL.y : PAL.Y) : PAL.n;
    ctx.fillRect(x, y, 8, 8);
  }
}
function drawField() {
  ctx.drawImage(dirtC, 0, TOP);
  drawTunnels(); drawItems(); drawRocks(); drawEnemies(); drawFires(); drawPlayer(); drawParts(); drawHUD();
}
function drawTitle() {
  const th = THEME, sky = Math.round(H * .4);
  ctx.fillStyle = th.sky; ctx.fillRect(0, 0, W, sky);
  ctx.fillStyle = th.sky2; ctx.fillRect(0, sky - 14, W, 14);
  const bh = Math.ceil((H - sky) / 4);
  for (let i = 0; i < 4; i++) { ctx.fillStyle = th.layers[i].b; ctx.fillRect(0, sky + i * bh, W, bh); }
  for (let i = 0; i < 160; i++) {
    const px = (i * 53) % W, py = sky + 4 + (i * 37) % (H - sky - 4);
    ctx.fillStyle = th.layers[clamp(Math.floor((py - sky) / bh), 0, 3)].d; ctx.fillRect(px, py, 2, 2);
  }
  ctx.fillStyle = PAL.G; ctx.fillRect(0, sky - 2, W, 3); ctx.fillStyle = PAL.k; ctx.fillRect(0, sky + 1, W, 1);
  const word = 'KIKPIK', cols = [PAL.p, PAL.y, PAL.g, PAL.v, PAL.p, PAL.y];
  const ly = Math.round(H * .06);
  for (let i = 0; i < 6; i++) txt(word[i], 14 + i * 28, ly + Math.round(Math.sin(gt * 4 + i * .7) * 3), cols[i], 24, 'left', 2);
  const fr = Math.floor(gt * 5) % 2;
  const ky = Math.max(ly + 64, Math.round((ly + 30 + sky) / 2) + 6);
  spr(S.hero[fr].r, W / 2, Math.min(ky, sky - 32) + (fr ? -2 : 0), 3, 3);
  const py = sky + 10;
  panel(py, 68);
  [['ВЕДИ ПАЛЬЦЕМ —', PAL.y], ['КОТИК БЕЖИТ ЗА НИМ', '#fff'], ['ПОДОЙДИ К ВРАГУ —', PAL.y], ['ОН ЕГО НАДУЕТ!', '#fff'], ['2 ТАПА — ПАУЗА', PAL.g]]
    .forEach(([s, c], i) => txt(s, W / 2, py + 7 + i * 12, c, 8, 'center'));
  const ty = py + 92;
  ctx.fillStyle = th.tun; ctx.fillRect(0, ty - 10, W, 22);
  ctx.fillStyle = th.tun2; ctx.fillRect(0, ty - 10, W, 3);
  TYPES.forEach((t, i) => {
    const x = ((gt * 26 + i * 36) % (W + 40)) - 20, st = S[t];
    shadow(x, ty - 1); spr(st[st.length > 1 ? Math.floor(gt * 6) % 2 : 0].r, x, ty - 1);
  });
  const by = Math.max(ty + 24, H - (hasProgress() ? 58 : 40));
  const lbl = hasProgress() ? 'ИГРАТЬ  ' + level + '-' + sub : 'ИГРАТЬ';
  BTN.play = button(lbl, 24, by, W - 48, 18, Math.floor(gt * 3) % 2 ? PAL.y : PAL.Y);
  BTN.newg = hasProgress() ? button('НОВАЯ ИГРА', 40, by + 24, W - 80, 14, PAL.L) : null;
  txt('РЕКОРД ' + best, W / 2, H - 13, '#fff', 8, 'center');
  BTN.mute = [W - 26, 0, 26, 22];
  ctx.fillStyle = PAL.k; ctx.fillRect(W - 24, 1, 22, 17); ctx.fillStyle = '#2a1838'; ctx.fillRect(W - 23, 2, 20, 15);
  drawSoundIcon(W - 20, 3);
}
function render() {
  ctx.setTransform(K, 0, 0, K, 0, 0); ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#2a1838'; ctx.fillRect(0, 0, W, H);
  if (state === 'title' || state === 'confirm') {
    drawTitle();
    if (state === 'confirm') {
      ctx.fillStyle = 'rgba(29,16,41,.6)'; ctx.fillRect(0, 0, W, H);
      const y = Math.round(H / 2 - 36);
      panel(y, 72);
      txt('НАЧАТЬ ЗАНОВО?', W / 2, y + 10, PAL.p, 8, 'center');
      txt('ПРОГРЕСС СОТРЁТСЯ', W / 2, y + 24, '#fff', 8, 'center');
      BTN.yes = button('ДА', 24, y + 44, 64, 18, PAL.p);
      BTN.no = button('НЕТ', W - 88, y + 44, 64, 18, PAL.g);
    }
    return;
  }
  drawField();
  const cy = Math.round(TOP + (H - TOP) * .42);
  if (state === 'ready') {
    panel(cy - 24, 56);
    txt('УРОВЕНЬ ' + level, W / 2, cy - 16, PAL.y, 8, 'center');
    txt('ЭТАП ' + sub + ' ИЗ ' + SUBS, W / 2, cy - 2, '#fff', 8, 'center');
    stageDots(W / 2, cy + 14);
  } else if (state === 'clear') {
    if (sub === SUBS) {
      panel(cy - 30, 72);
      txt('УРОВЕНЬ ' + level, W / 2, cy - 22, PAL.y, 8, 'center');
      txt('ПРОЙДЕН!', W / 2, cy - 8, PAL.g, 16, 'center', 1);
      txt('+' + stageBonus, W / 2, cy + 14, PAL.y, 8, 'center');
      txt('ЖИЗНИ ПОПОЛНЕНЫ', W / 2, cy + 28, PAL.p, 8, 'center');
    } else {
      panel(cy - 24, 56);
      txt('ЭТАП ПРОЙДЕН!', W / 2, cy - 16, PAL.g, 8, 'center');
      txt('+' + stageBonus, W / 2, cy - 2, PAL.y, 8, 'center');
      stageDots(W / 2, cy + 14);
    }
  } else if (state === 'fail') {
    ctx.fillStyle = 'rgba(29,16,41,.55)'; ctx.fillRect(0, TOP, W, H - TOP);
    panel(cy - 34, 80);
    txt('ЖИЗНИ', W / 2, cy - 26, PAL.p, 16, 'center', 1);
    txt('КОНЧИЛИСЬ', W / 2, cy - 8, PAL.p, 16, 'center', 1);
    txt('УРОВЕНЬ ' + level, W / 2, cy + 14, PAL.y, 8, 'center');
    txt('ЕЩЁ РАЗ С НАЧАЛА!', W / 2, cy + 28, '#fff', 8, 'center');
  } else if (state === 'paused') {
    ctx.fillStyle = 'rgba(29,16,41,.6)'; ctx.fillRect(0, TOP, W, H - TOP);
    panel(cy - 30, 84);
    txt('ПАУЗА', W / 2, cy - 20, PAL.y, 16, 'center', 1);
    stageDots(W / 2, cy + 2);
    if (Math.floor(gt * 2.5) % 2) txt('ТАПНИ — ДАЛЬШЕ', W / 2, cy + 18, PAL.g, 8, 'center');
    BTN.home = button('В МЕНЮ', 56, cy + 34, W - 112, 14, PAL.L);
  } else if (state === 'victory') {
    ctx.fillStyle = 'rgba(29,16,41,.5)'; ctx.fillRect(0, TOP, W, H - TOP);
    panel(cy - 34, 84);
    txt('ПОБЕДА!', W / 2, cy - 24, PAL.y, 16, 'center', 1);
    txt('ВСЕ 200 УРОВНЕЙ!', W / 2, cy - 2, PAL.g, 8, 'center');
    txt('ОЧКИ ' + score, W / 2, cy + 12, '#fff', 8, 'center');
    if (stT <= 0 && Math.floor(gt * 2.5) % 2) txt('ТАПНИ — ЕЩЁ КРУГ', W / 2, cy + 30, PAL.p, 8, 'center');
  }
  if (state === 'fail' || state === 'victory') drawParts();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); render();
  requestAnimationFrame(loop);
}
load();
THEME = makeTheme(level);
applyRows(calcRows());
resetPlayer();
if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"', 'АБВ').catch(() => {});
window.KIKPIK_STATE = () => ({ state, score, level, sub, lives, meter, rows: ROWS, enemies: enemies.map(e => [e.x, e.y + TOP, e.state]) });
requestAnimationFrame(loop);
})();
</script>
