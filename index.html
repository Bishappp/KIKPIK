function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const pad = Math.min(vw, vh) > 500 ? 24 : 6;
  const s = Math.min((vw - pad) / W, (vh - pad) / H);
  const dpr = window.devicePixelRatio || 1;
  K = Math.max(1, Math.ceil(s * dpr));
  cv.width = W * K; cv.height = H * K;
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';

}

const rint = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const md = (a, b, c, d) => Math.abs(a - c) + Math.abs(b - d);
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

// ============ ПАЛИТРА И СПРАЙТЫ ============
const PAL = {

  g: '#8fe36b', G: '#3fae5a', v: '#b48cff', V: '#7a4fe0', s: '#ffd6b8', r: '#ff5c7a',
  l: '#ece4ff', L: '#c7b6f2', n: '#4a2d63', o: '#b9733f'
};
function mk(rows) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) { const ch = row[i]; if (ch !== '.' && PAL[ch]) { x.fillStyle = PAL[ch]; x.fillRect(i, j, 1, 1); } } });
  return c;
}
function flip(src) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0); return c;
}
function tint(src, col, a) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0);
  x.globalCompositeOperation = 'source-atop'; x.globalAlpha = a; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
  return c;
}
function set(rows) {
  const r = mk(rows), l = flip(r);
  return { r, l, wr: tint(r, '#fff', .75), wl: tint(l, '#fff', .75), rr: tint(r, '#ff2a5a', .55), rl: tint(l, '#ff2a5a', .55) };
}

const S = {

  dino: [set(DINO_A), set(DINO_B)],
  snail: [set(SNAIL)], worm: [set(WORM)], ghost: [set(GHOST)], spider: [set(SPIDER)],
  rock: mk(ROCK),
  fruit: [mk(STRAW), mk(CHERRY), mk(GRAPE), mk(APPLE)],
  chest: mk(CHEST), gem: mk(GEM), seed: mk(SEED),
  heart: mk(HEART), heartE: mk(HEART.map(r => r.replace(/[pw]/g, 'n')))
};

// ============ ЗВУК ============
let AC = null, muted = false;
try { muted = localStorage.getItem('kikpik_mute') === '1'; } catch (e) {}
function unlock() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f1, f2, d, type = 'square', v = .06, delay = 0) {
  if (muted || !AC) return;
  try {
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .03);
  } catch (e) {}
}
const SFX = {
  dig: () => tone(160, 110, .05, 'square', .025),
  pump: () => tone(320, 640, .08, 'square', .05),
  pop: () => { tone(900, 140, .22, 'square', .07); tone(1400, 400, .12, 'triangle', .05, .02); },
  item: () => { tone(660, 660, .07, 'square', .05); tone(990, 990, .1, 'square', .05, .07); },
  bloom: () => { tone(523, 523, .08, 'triangle', .08); tone(784, 784, .12, 'triangle', .08, .08); },
  die: () => { tone(800, 60, 1.1, 'sawtooth', .06); },
  rock: () => tone(140, 40, .35, 'triangle', .14),
  fire: () => tone(220, 70, .5, 'sawtooth', .04),
  life: () => [784, 988, 1318, 1568].forEach((f, i) => tone(f, f, .1, 'triangle', .09, i * .08)),
  clear: () => [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, f, .12, 'square', .05, i * .11)),
  start: () => [392, 523, 659, 784].forEach((f, i) => tone(f, f, .09, 'square', .05, i * .09))
};

// ============ СОСТОЯНИЕ ============
const GROW = 7;
const TYPES = ['worm', 'snail', 'dino', 'spider', 'ghost'];
const ETYPE = { worm: 1, snail: .75, dino: .9, spider: 1.25, ghost: .95 };
let state = 'title', level = 1, score = 0, lives = 5, meter = 0, best = 0, stT = 0, gt = 0, overT = 0, rocksDropped = 0;
let grid = new Uint8Array(COLS * ROWS), rocks = [], enemies = [], items = [], parts = [], pops = [], fires = [];
let player = null, tgt = null, levelBonus = 0;
try { best = +localStorage.getItem('kikpik_best') || 0; } catch (e) {}

const idx = (c, r) => r * COLS + c;
const inB = (c, r) => c >= 0 && c < COLS && r >= 0 && r < ROWS;
const dug = (c, r) => inB(c, r) && (r === 0 || grid[idx(c, r)] === 1);
const setDug = (c, r) => { if (inB(c, r) && r > 0) grid[idx(c, r)] = 1; };
const rockBlock = (c, r) => rocks.some(k => (k.st === 'idle' || k.st === 'wobble') && k.c === c && k.r === r);

// слои земли: розовый, жёлтый, зелёный, фиолетовый
const LAYERS = [
  { b: '#ffc6de', d: '#f394c2', e: '#e277ad' },
  { b: '#ffe7a3', d: '#f5c95a', e: '#e8b23c' },
  { b: '#c6ef9e', d: '#93d86e', e: '#6fbf52' },
  { b: '#dac6ff', d: '#b08ef5', e: '#9670e6' }];
const layerOf = r => LAYERS[(Math.floor((Math.max(1, r) - 1) / 4) + level - 1) % 4];

// ============ УРОВЕНЬ ============
function phaseTime(e) {
  const base = e.type === 'ghost' ? rnd(2.5, 5) : rnd(7, 13);
  return Math.max(2, base - level * .25);
}
function makeEnemy(type, c, r) {
  const e = { type, c0: c, r0: r, x: c * T + 8, y: r * T + 8, goal: null, dir: [1, 0], face: Math.random() < .5 ? 1 : -1,
    state: 'walk', infl: 0, deflT: 0, phasing: false, phaseDur: 0, phaseT: 0, fireT: rnd(2, 4), charge: 0, breath: 0, anim: Math.random() * 2 };
  e.phaseT = phaseTime(e) + 2;
  e.spd = Math.min(20 + level * 1.4, 36) * ETYPE[type];
  return e;
}
function buildLevel() {
  grid = new Uint8Array(COLS * ROWS);
  for (let r = 1; r <= 6; r++) grid[idx(6, r)] = 1;
  rocks = []; enemies = []; items = []; fires = []; parts = []; pops = []; rocksDropped = 0;
  const res = new Uint8Array(COLS * ROWS);
  const mark = (c, r, m) => { for (let y = r - m; y <= r + m; y++) for (let x = c - m; x <= c + m; x++) if (inB(x, y)) res[idx(x, y)] = 1; };
  for (let r = 0; r <= 8; r++) for (let c = 4; c <= 8; c++) res[idx(c, r)] = 1;

  const n = Math.min(2 + Math.ceil(level / 2), 9);
  const avail = TYPES.slice(0, Math.min(5, level + 1));
  for (let i = 0; i < n; i++) {
    const type = i === 0 ? avail[avail.length - 1] : avail[rint(0, avail.length - 1)];
    let cells = null;
    for (let tr = 0; tr < 300 && !cells; tr++) {
      const hz = Math.random() < .55, len = rint(3, 4);
      const c = hz ? rint(0, COLS - len) : rint(0, COLS - 1), r = hz ? rint(3, ROWS - 2) : rint(3, ROWS - len);
      const cs = []; for (let k = 0; k < len; k++) cs.push(hz ? [c + k, r] : [c, r + k]);
      if (cs.every(([x, y]) => inB(x, y) && y >= 2 && !res[idx(x, y)])) cells = cs;
    }
    if (!cells) {
      for (let tr = 0; tr < 300 && !cells; tr++) { const c = rint(0, COLS - 1), r = rint(3, ROWS - 1); if (!res[idx(c, r)]) cells = [[c, r]]; }
      if (!cells) cells = [[rint(0, COLS - 1), ROWS - 1]];
    }
    cells.forEach(([x, y]) => { grid[idx(x, y)] = 1; });
    cells.forEach(([x, y]) => mark(x, y, 1));
    const [ec, er] = cells[Math.floor(cells.length / 2)];
    enemies.push(makeEnemy(type, ec, er));
  }
  const nr = Math.min(3 + Math.floor(level / 3), 6);
  for (let i = 0, tr = 0; i < nr && tr < 500; tr++) {
    const c = rint(0, COLS - 1), r = rint(2, ROWS - 4);
    if (res[idx(c, r)] || res[idx(c, r + 1)] || grid[idx(c, r)] || grid[idx(c, r + 1)]) continue;
    rocks.push({ c, r, x: c * T + 8, y: r * T + 8, st: 'idle', t: 0, vy: 0, crushed: [] });
    mark(c, r, 1); i++;
  }
  const place = (type, minR, sub = 0) => {
    for (let tr = 0; tr < 500; tr++) {
      const c = rint(0, COLS - 1), r = rint(minR, ROWS - 1);
      if (grid[idx(c, r)] || rockBlock(c, r) || items.some(it => it.c === c && it.r === r)) continue;
      items.push({ type, c, r, sub, t: 0 }); return;
    }
  };
  const nf = 3 + (level > 4 ? 1 : 0);
  for (let i = 0; i < nf; i++) place('fruit', 2, rint(0, 3));
  place(Math.random() < .5 ? 'chest' : 'gem', 9);
  if (level % 3 === 0) place(Math.random() < .5 ? 'chest' : 'gem', 5);
  const ns = 1 + (level % 2);
  for (let i = 0; i < ns; i++) place('seed', 3);
}

let dirtC = null;
function buildDirt() {
  dirtC = document.createElement('canvas'); dirtC.width = W; dirtC.height = ROWS * T;
  const x = dirtC.getContext('2d');
  let sd = level * 7919 + 13;
  const R = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
  // небо
  x.fillStyle = '#fff0f7'; x.fillRect(0, 0, W, T);
  x.fillStyle = '#ffe1ef'; x.fillRect(0, 10, W, 6);
  for (let i = 0; i < 3; i++) { // облачка
    const cx = Math.floor(R() * (W - 20)), cy = 2 + Math.floor(R() * 3);
    x.fillStyle = '#ffffff'; x.fillRect(cx, cy + 1, 12, 3); x.fillRect(cx + 3, cy, 6, 5);
  }
  // земля
  for (let r = 1; r < ROWS; r++) { x.fillStyle = layerOf(r).b; x.fillRect(0, r * T, W, T); }
  for (let r = 1; r < ROWS; r++) {
    const L = layerOf(r);
    for (let i = 0; i < 24; i++) {
      const px = Math.floor(R() * W), py = r * T + Math.floor(R() * T);
      x.fillStyle = R() < .6 ? L.d : L.e; const s = R() < .3 ? 2 : 1; x.fillRect(px, py, s, s);
    }
  }
  // волнистые границы слоёв
  for (const b of [5, 9, 13]) {
    const L = layerOf(b - 1);
    for (let i = 0; i < W; i++) {
      const off = Math.round(Math.sin(i / 5 + level + b) * 1.5);
      x.fillStyle = L.b; x.fillRect(i, b * T, 1, 2 + off);
      x.fillStyle = L.e; x.fillRect(i, b * T + 2 + off, 1, 1);
    }
  }
  // травка
  x.fillStyle = '#3fae5a'; x.fillRect(0, T, W, 3);
  x.fillStyle = '#8fe36b';
  for (let i = 0; i < W; i += 2) { const h = (i * 7 + level) % 5 === 0 ? 3 : 1; x.fillRect(i, T - h + 1, 1, h); }
  x.fillStyle = '#1d1029'; x.fillRect(0, T + 3, W, 1);
  // цветочки на поверхности
  for (let i = 0; i < 5; i++) {
    const fx = Math.floor(R() * (W - 8)) + 2;
    if (Math.abs(fx - 104) < 14) continue;
    x.fillStyle = '#3fae5a'; x.fillRect(fx + 1, T - 3, 1, 3);
    x.fillStyle = i % 2 ? '#ff86c0' : '#b48cff'; x.fillRect(fx, T - 5, 3, 2); x.fillRect(fx + 1, T - 6, 1, 4);
    x.fillStyle = '#ffe066'; x.fillRect(fx + 1, T - 5, 1, 1);
  }
}

function resetPlayer() {
  player = { x: 6 * T + 8, y: 8, goal: null, dir: [0, 1], face: 1, moving: false, anim: 0, pump: null, cool: 0, deadT: 0, burst: false, digSnd: 0 };
  tgt = null;
}
function startLevel() {
  buildLevel(); buildDirt(); resetPlayer();
  state = 'ready'; stT = 1.6;
}
function startGame() {
  level = 1; score = 0; lives = 5; meter = 0;
  startLevel(); SFX.start();
}

// ============ ЭФФЕКТЫ ============
function burst(x, y, cols, n, spd = 60, grav = 120, size = 2) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rnd(spd * .3, spd);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, t: 0, life: rnd(.4, .8), col: cols[i % cols.length], size, grav });
  }
}
function popup(x, y, s, col = '#ffe066') { pops.push({ x, y, s, col, t: 0 }); }
function addMeter(v) {
  meter += v;
  while (meter >= 100) {
    meter -= 100;
    if (lives < 5) { lives++; popup(player.x, TOP + player.y - 16, '+1 ЖИЗНЬ', '#ff86c0'); }
    else { score += 2000; popup(player.x, TOP + player.y - 16, '+2000', '#8fe36b'); }
    SFX.life();
  }
}

}
function drawSprout(x, y, t) {
  const g = Math.min(1, t / GROW), base = y + 6, h = 2 + Math.round(g * 8);
  ctx.fillStyle = PAL.o; ctx.fillRect(x - 4, base, 8, 2);
  ctx.fillStyle = PAL.k; ctx.fillRect(x - 2, base - h - 1, 4, h + 1);
  ctx.fillStyle = PAL.G; ctx.fillRect(x - 1, base - h, 2, h);
  if (g > .3) {
    const ly = Math.round(base - h * .5);
    ctx.fillStyle = PAL.k; ctx.fillRect(x - 6, ly - 1, 5, 4); ctx.fillRect(x + 1, ly - 2, 5, 4);
    ctx.fillStyle = PAL.g; ctx.fillRect(x - 5, ly, 3, 2); ctx.fillRect(x + 2, ly - 1, 3, 2);
  }
  const top = base - h;
  if (g >= 1) {
    const b = Math.floor(gt * 3) % 2;
    ctx.fillStyle = PAL.k; ctx.fillRect(x - 5, top - 7 + b, 10, 8); ctx.fillRect(x - 3, top - 9 + b, 6, 12);
    ctx.fillStyle = PAL.p; ctx.fillRect(x - 4, top - 6 + b, 8, 6); ctx.fillRect(x - 2, top - 8 + b, 4, 10);
    ctx.fillStyle = PAL.y; ctx.fillRect(x - 1, top - 4 + b, 2, 2);
    if (Math.floor(gt * 4) % 3 === 0) { ctx.fillStyle = '#fff'; ctx.fillRect(x + 6, top - 9, 1, 3); ctx.fillRect(x + 5, top - 8, 3, 1); }
  } else if (g > .6) {
    ctx.fillStyle = PAL.k; ctx.fillRect(x - 2, top - 4, 4, 5);
    ctx.fillStyle = PAL.p; ctx.fillRect(x - 1, top - 3, 2, 3);
  }
}
function sparkle(x, y, phase) {
  if (Math.floor(gt * 2 + phase) % 4 !== 0) return;
  ctx.fillStyle = '#fff'; ctx.fillRect(x, y - 1, 1, 3); ctx.fillRect(x - 1, y, 3, 1);
}
function drawItems() {
  for (const it of items) {
    const x = it.c * T + 8, y = TOP + it.r * T + 8;
    switch (it.type) {
      case 'fruit': spr(S.fruit[it.sub], x, y); sparkle(x + 5, y - 5, it.c); break;
      case 'chest': spr(S.chest, x, y); sparkle(x + 5, y - 4, it.c); break;
      case 'gem': spr(S.gem, x, y); sparkle(x + 3, y - 4, it.c + 1); break;
      case 'seed': spr(S.seed, x, y); break;
      case 'sprout': drawSprout(x, y, it.t); break;
      case 'bonus':
        if (it.t > 3 || Math.floor(gt * 8) % 2) { shadow(x, y); spr(S.fruit[it.sub], x, y - 1 + (Math.floor(gt * 4) % 2), 1.25, 1.25); sparkle(x + 7, y - 7, 0); }
        break;
    }
  }
}
function drawRocks() {
  for (const k of rocks) {
    const x = k.x, y = TOP + k.y;
    if (k.st === 'break') {
      const a = k.t / .6, sp = (1 - a) * 6;
      ctx.globalAlpha = a;
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, x, H); ctx.clip(); spr(S.rock, x - sp, y + 2, 1, .85); ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.rect(x, 0, W, H); ctx.clip(); spr(S.rock, x + sp, y + 2, 1, .85); ctx.restore();
      ctx.globalAlpha = 1; continue;
    }
    const wob = k.st === 'wobble' ? (Math.floor(gt * 20) % 2 ? 1 : -1) : 0;
    spr(S.rock, x + wob, y);
  }
}
function drawEnemies() {
  for (const e of enemies) {
    const x = e.x, y = TOP + e.y, set = S[e.type];
    const fr = set.length > 1 ? Math.floor(e.anim * 6) % 2 : 0;
    const sd = set[fr], R = e.face > 0;
    if (e.state === 'crushed') { spr(R ? sd.r : sd.l, x, y + 3, 1.25, .45); continue; }
    if (e.phasing) {
      ctx.globalAlpha = Math.floor(gt * 10) % 2 ? .35 : .6;
      spr(R ? sd.r : sd.l, x, y);
      ctx.globalAlpha = 1; continue;
    }
    const bob = (set.length === 1 && e.infl === 0) ? (Math.floor(e.anim * 5) % 2 ? -1 : 0) : 0;
    shadow(x, y, 10 + e.infl * 2);
    let img = R ? sd.r : sd.l;
    if (e.charge > 0 && Math.floor(gt * 16) % 2) img = R ? sd.rr : sd.rl;
    if (e.flash > 0) img = R ? sd.wr : sd.wl;
    if (e.infl > 0) {
      const sc = 1 + e.infl * .22;
      spr(img, x, y - e.infl, sc, sc * .95);
    } else spr(img, x, y + bob);
  }
}
function drawFires() {
  for (const f of fires) {
    const x0 = f.e.x + f.dir * 7, y = TOP + f.e.y, len = f.len || 0;
    for (let i = 0; i < len; i += 4) {
      const fx = x0 + f.dir * i, s = 3 + Math.min(4, i / 6) + (Math.floor(gt * 20 + i) % 2);
      ctx.fillStyle = PAL.k; ctx.fillRect(Math.round(fx - s / 2 - 1), Math.round(y - s / 2 - 1), Math.round(s + 2), Math.round(s + 2));
    }
    for (let i = 0; i < len; i += 4) {
      const fx = x0 + f.dir * i, s = 3 + Math.min(4, i / 6) + (Math.floor(gt * 20 + i) % 2);
      ctx.fillStyle = (Math.floor(i / 4 + gt * 12) % 2) ? PAL.y : PAL.p;
      ctx.fillRect(Math.round(fx - s / 2), Math.round(y - s / 2), Math.round(s), Math.round(s));
      ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(fx), Math.round(y), 1, 1);
    }
  }
}
function drawPlayer() {
  const P = player; if (!P) return;
  const sx = P.x, sy = TOP + P.y;
  const hs = S.hero[0], R = P.face > 0;
  if (state === 'dying') {
    const t = P.deadT;
    if (t < .5) spr((Math.floor(t * 20) % 2) ? (R ? hs.wr : hs.wl) : (R ? hs.r : hs.l), sx + (Math.floor(t * 30) % 2 ? 1 : -1), sy);
    else if (t < 1.4) {
      const k = 1 - (t - .5) / .9;
      ctx.save(); ctx.translate(Math.round(sx), Math.round(sy)); ctx.rotate((t - .5) * 10);
      spr(R ? hs.r : hs.l, 0, 0, k, k); ctx.restore();
    }
    return;
  }
  shadow(sx, sy);
  const fr = P.moving ? Math.floor(P.anim * 8) % 2 : 0;
  const bob = P.moving ? (fr ? -1 : 0) : (Math.floor(gt * 2) % 2 && !P.pump ? 0 : 0);
  let img = S.hero[fr][R ? 'r' : 'l'];
  let jx = 0;
  if (P.pump) { jx = P.pump.tick > .22 ? -P.pump.d[0] : 0; }
  spr(img, sx + jx, sy + bob);
  if (P.pump) {
    const p = P.pump, e = p.e, d = p.d;
    const ax = P.x + d[0] * 7, ay = TOP + P.y + d[1] * 7 + (d[0] ? 2 : 0);
    const ex = e.x - d[0] * (6 + e.infl), ey = TOP + e.y - d[1] * (6 + e.infl) + (d[0] ? 1 : 0);
    const bx = ax + (ex - ax) * p.ext, by = ay + (ey - ay) * p.ext;
    const x0 = Math.round(Math.min(ax, bx)), y0 = Math.round(Math.min(ay, by));
    const w = Math.round(Math.abs(bx - ax)), h = Math.round(Math.abs(by - ay));
    ctx.fillStyle = PAL.k;
    if (d[0]) ctx.fillRect(x0, y0 - 1, w + 1, 3); else ctx.fillRect(x0 - 1, y0, 3, h + 1);
    ctx.fillStyle = PAL.y;
    if (d[0]) ctx.fillRect(x0, y0, w + 1, 1); else ctx.fillRect(x0, y0, 1, h + 1);
    ctx.fillStyle = PAL.k; ctx.fillRect(Math.round(bx) - 2, Math.round(by) - 2, 5, 5);
    ctx.fillStyle = PAL.p; ctx.fillRect(Math.round(bx) - 1, Math.round(by) - 1, 3, 3);
  }
}
function drawParts() {
  for (const p of parts) { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size); }
  for (const p of pops) {
    if (p.t > .8 && Math.floor(p.t * 16) % 2) continue;
    const w = p.s.length * 8;
    txt(p.s, clamp(p.x, w / 2 + 2, W - w / 2 - 2), Math.round(p.y), p.col, 8, 'center');
  }
}
function drawHUD() {
  ctx.fillStyle = '#2a1838'; ctx.fillRect(0, 0, W, TOP);
  ctx.fillStyle = PAL.k; ctx.fillRect(0, TOP - 1, W, 1);
  txt(String(score).padStart(7, '0'), 4, 3, '#ffe066');
  txt('УР ' + level, 128, 3, '#b48cff', 8, 'center');
  for (let i = 0; i < 5; i++) ctx.drawImage(i < lives ? S.heart : S.heartE, 4 + i * 9, 15);
  const bx = 52, bw = W - bx - 30, by = 15;
  ctx.fillStyle = PAL.k; ctx.fillRect(bx - 1, by - 1, bw + 2, 8);
  ctx.fillStyle = '#4a2d63'; ctx.fillRect(bx, by, bw, 6);
  const fw = Math.round(bw * meter / 100);
  if (fw > 0) {
    ctx.fillStyle = PAL.P; ctx.fillRect(bx, by, fw, 6);
    ctx.fillStyle = PAL.p; ctx.fillRect(bx, by, fw, 4);
    ctx.fillStyle = '#ffc6de'; ctx.fillRect(bx, by + 1, fw, 1);
  }
  for (let i = 1; i < 4; i++) { ctx.fillStyle = 'rgba(29,16,41,.6)'; ctx.fillRect(bx + Math.round(bw * i / 4), by, 1, 6); }
  // звук
  const mx = W - 22, my = 6;
  ctx.fillStyle = PAL.l;
  ctx.fillRect(mx, my + 4, 3, 5); ctx.fillRect(mx + 3, my + 2, 2, 9); ctx.fillRect(mx + 5, my, 2, 13);
  if (muted) { ctx.fillStyle = PAL.r; for (let i = 0; i < 6; i++) { ctx.fillRect(mx + 9 + i, my + 3 + i, 2, 1); ctx.fillRect(mx + 14 - i, my + 3 + i, 2, 1); } }
  else { ctx.fillStyle = PAL.l; ctx.fillRect(mx + 9, my + 4, 1, 5); ctx.fillRect(mx + 12, my + 2, 1, 9); }
}
function panel(y, h) {
  ctx.fillStyle = PAL.k; ctx.fillRect(12, y - 2, W - 24, h + 4);
  ctx.fillStyle = PAL.p; ctx.fillRect(14, y, W - 28, h);
  ctx.fillStyle = '#2a1838'; ctx.fillRect(16, y + 2, W - 32, h - 4);
}
function drawField() {
  ctx.drawImage(dirtC, 0, TOP);
  drawTunnels(); drawItems(); drawRocks(); drawEnemies(); drawFires(); drawPlayer(); drawParts(); drawHUD();
}
function drawTitle() {
  // фон
  const L = [LAYERS[0], LAYERS[1], LAYERS[2], LAYERS[3]];
  ctx.fillStyle = '#fff0f7'; ctx.fillRect(0, 0, W, 120);
  for (let i = 0; i < 4; i++) { ctx.fillStyle = L[i].b; ctx.fillRect(0, 120 + i * 44, W, 44); }
  for (let i = 0; i < 140; i++) { const px = (i * 53) % W, py = 122 + (i * 37) % 174; ctx.fillStyle = L[Math.floor((py - 120) / 44) % 4].d; ctx.fillRect(px, py, 2, 2); }
  ctx.fillStyle = '#3fae5a'; ctx.fillRect(0, 118, W, 3); ctx.fillStyle = PAL.k; ctx.fillRect(0, 121, W, 1);
  // туннель с героем
  ctx.fillStyle = TUN; ctx.fillRect(0, 212, W, 22);
  ctx.fillStyle = TUN2; ctx.fillRect(0, 212, W, 2);
  // заголовок
  const word = 'KIKPIK', cols = ['#ff86c0', '#ffe066', '#8fe36b', '#b48cff', '#ff86c0', '#ffe066'];
  for (let i = 0; i < 6; i++) {
    const by = 28 + Math.round(Math.sin(gt * 4 + i * .7) * 3);
    txt(word[i], 32 + i * 32, by, cols[i], 28, 'left', 2);
  }
  // герой
  const fr = Math.floor(gt * 6) % 2;
  spr(S.hero[fr].r, W / 2, 92 + (fr ? -1 : 0), 3, 3);
  // парад врагов
  const types = ['worm', 'snail', 'dino', 'spider', 'ghost'];
  types.forEach((t, i) => {
    const x = ((gt * 26 + i * 46) % (W + 48)) - 24;
    const s = S[t][S[t].length > 1 ? Math.floor(gt * 6) % 2 : 0];
    shadow(x, 222);
    spr(s.r, x, 222 + (S[t].length === 1 && Math.floor(gt * 5 + i) % 2 ? -1 : 0));
  });
  panel(134, 72);
  const lines = [['ВЕДИ ПАЛЬЦЕМ —', '#ffe066'], ['KIKPIK БЕЖИТ ЗА НИМ', '#ffffff'], ['ПОДОЙДИ К ВРАГУ —', '#ffe066'], ['ОН ЕГО НАДУЕТ!', '#ffffff'], ['ЕДА И КЛАДЫ = ЖИЗНЬ', '#8fe36b']];
  lines.forEach(([s, c], i) => txt(s, W / 2, 142 + i * 12, c, 8, 'center'));
  if (Math.floor(gt * 2.5) % 2) txt('ТАПНИ, ЧТОБЫ ИГРАТЬ', W / 2, 248, '#ff86c0', 8, 'center');
  txt('РЕКОРД ' + String(best).padStart(7, '0'), W / 2, 268, '#ffffff', 8, 'center');
}
function render() {
  ctx.setTransform(K, 0, 0, K, 0, 0); ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#2a1838'; ctx.fillRect(0, 0, W, H);
  if (state === 'title') { drawTitle(); return; }
  drawField();
  if (state === 'ready') {
    panel(126, 40);
    txt('УРОВЕНЬ ' + level, W / 2, 134, '#ffe066', 8, 'center');
    txt(lives < 5 && level > 0 && stT < 1.45 ? 'ПОЕХАЛИ!' : 'ГОТОВ?', W / 2, 150, '#ff86c0', 8, 'center');
  } else if (state === 'clear') {
    panel(120, 52);
    txt('УРОВЕНЬ', W / 2, 128, '#8fe36b', 8, 'center');
    txt('ПРОЙДЕН!', W / 2, 142, '#8fe36b', 8, 'center');
    txt('+' + levelBonus, W / 2, 156, '#ffe066', 8, 'center');
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(29,16,41,.55)'; ctx.fillRect(0, TOP, W, H - TOP);
    panel(98, 104);
    txt('ИГРА', W / 2, 108, '#ff86c0', 16, 'center', 1);
    txt('ОКОНЧЕНА', W / 2, 128, '#ff86c0', 16, 'center', 1);
    txt('ОЧКИ ' + score, W / 2, 152, '#ffe066', 8, 'center');
    txt('РЕКОРД ' + best, W / 2, 166, '#ffffff', 8, 'center');
    if (overT > .8 && Math.floor(gt * 2.5) % 2) txt('ТАПНИ — ЗАНОВО', W / 2, 184, '#8fe36b', 8, 'center');
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); render();
  requestAnimationFrame(loop);
}
resetPlayer(); buildLevel(); buildDirt();
if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(() => {});
window.KIKPIK_STATE = () => ({ state, score, level, lives, meter, enemies: enemies.map(e => [e.x, e.y + TOP, e.state]) });
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
